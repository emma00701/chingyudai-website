<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Ching Yu Dai</title>
<link rel="icon" type="image/png" href="images/pig-favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>

<header class="site-header">
  <nav class="icon-nav" aria-label="Site navigation">
    <a class="nav-icon" href="index.html" aria-label="My World">
      <img src="icons/home.png" alt="My World">
    </a>
    <a class="nav-icon" href="about.html" aria-label="About me">
      <img src="icons/about.png" alt="About me">
    </a>
    <a class="nav-icon active" href="gallery.html" aria-label="Gallery">
      <img src="icons/gallery.png" alt="Gallery">
    </a>
    <a class="nav-icon" href="resume.html" aria-label="Résumé">
      <img src="icons/resume.png" alt="Résumé">
    </a>
  </nav>
</header>

<main>
  <section class="page active inner-page">
    <div class="section-heading projects-heading">
      <div>
        <p class="eyebrow">Selected works</p>
        <h1>Gallery</h1>
      </div>
      <div class="project-filters" aria-label="Project categories">
        <button class="filter-button active" data-gallery="paintings" onclick="showGallery('paintings')">Paintings</button>
        <button class="filter-button" data-gallery="drawings" onclick="showGallery('drawings')">Drawings</button>
        <button class="filter-button" data-gallery="3d" onclick="showGallery('3d')">3D Models</button>
      </div>
    </div>
    <div class="gallery-intro">
      <p id="gallery-subtitle"></p>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>
</main>

<footer class="page-footer">
  <div class="footer-row">
    <p class="footer-credit">Designed with <span class="heart">♡</span> and lots of matcha!</p>
    <div class="footer-links">
      <a href="https://www.linkedin.com/in/emmadai118" target="_blank" rel="noopener">linkedin</a>
      <a href="mailto:chingyudai7@gmail.com">email</a>
      <a href="https://instagram.com/emma11111118" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>

<div class="lightbox" id="lightbox" onclick="closeLightboxOutside(event)">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">×</button>
  <div class="lightbox-inner">
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="">
    </div>
    <div class="lightbox-info">
      <h2 id="lb-title"></h2>
      <p class="lightbox-meta" id="lb-meta"></p>
      <p class="lightbox-desc" id="lb-desc"></p>
    </div>
  </div>
  <div class="lightbox-nav">
    <button onclick="lbNav(-1)">← Prev</button>
    <button onclick="lbNav(1)">Next →</button>
  </div>
</div>

<script src="js/script.js?v=27"></script>
</body>
</html>
